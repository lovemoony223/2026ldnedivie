<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>初夏英倫慢旅行｜2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --navy:#17233d;
      --blue:#2f6fb3;
      --sky:#eaf4ff;
      --cream:#fff8ef;
      --rose:#c96f6f;
      --green:#5f7f68;
      --bg:#f6f3ee;
      --card:#ffffff;
      --text:#2f3440;
      --muted:#747b89;
      --line:#e8e2d8;
      --shadow:0 10px 28px rgba(23,35,61,.10);
      --radius:22px;
    }

    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    html { scroll-behavior:smooth; }
    body {
      font-family:'Noto Sans TC', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.75;
      padding-bottom:32px;
    }

    a { color:inherit; text-decoration:none; }
    img { display:block; width:100%; }

    .app-header {
      position:sticky;
      top:0;
      z-index:50;
      background:rgba(23,35,61,.96);
      color:white;
      padding:18px 18px 14px;
      box-shadow:0 6px 20px rgba(0,0,0,.18);
      backdrop-filter: blur(10px);
    }
    .app-header h1,
    .app-header p {
      max-width:920px;
      margin-left:auto;
      margin-right:auto;
    }
    .app-header h1 { font-size:1.2rem; letter-spacing:.03em; font-weight:900; }
    .app-header p { font-size:.82rem; opacity:.82; margin-top:2px; }

    .day-nav {
      position:sticky;
      top:72px;
      z-index:45;
      display:flex;
      overflow-x:auto;
      gap:8px;
      padding:10px max(12px, calc((100vw - 920px) / 2 + 14px));
      background:rgba(246,243,238,.94);
      border-bottom:1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .day-nav::-webkit-scrollbar { display:none; }
    .day-tab {
      flex:0 0 auto;
      border:1px solid var(--line);
      background:white;
      color:var(--navy);
      border-radius:999px;
      padding:8px 13px;
      font-size:.84rem;
      font-weight:700;
      box-shadow:0 3px 10px rgba(23,35,61,.04);
    }
    .day-tab.active { background:var(--navy); color:white; border-color:var(--navy); }

    .container { max-width:920px; margin:0 auto; padding:18px 14px; }
    .day-content { display:none; animation:fadeIn .22s ease; }
    .day-content.active { display:block; }
    @keyframes fadeIn { from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:translateY(0)} }

    .hero {
      overflow:hidden;
      border-radius:28px;
      background:var(--card);
      box-shadow:var(--shadow);
      margin:6px 0 16px;
      border:1px solid rgba(255,255,255,.7);
    }
    .hero-img {
      height:245px;
      object-fit:cover;
      background:#ddd;
    }
    .hero-img.broken { display:none; }
    .hero-body { padding:18px; }
    .eyebrow { color:var(--rose); font-weight:900; font-size:.82rem; letter-spacing:.06em; margin-bottom:5px; }
    .hero h2 { color:var(--navy); font-size:1.45rem; line-height:1.3; margin-bottom:10px; }
    .intro { color:#4b5565; font-size:.97rem; }

    .section-title {
      display:flex;
      align-items:center;
      gap:8px;
      margin:22px 4px 10px;
      color:var(--navy);
      font-size:1.06rem;
      font-weight:900;
    }
    .section-title i { color:var(--rose); }

    .info-card, .meal-card, .hotel-card {
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:16px;
      margin-bottom:12px;
    }

    .tips-card {
      background:var(--cream);
      border:1px solid #f0d5b8;
      border-left:5px solid #d9904d;
      border-radius:18px;
      padding:14px;
      margin-bottom:12px;
      color:#6f421f;
      font-size:.92rem;
    }
    .tips-card strong { color:#5c3518; }
    .guide-link {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      margin-top:12px;
      padding:10px 13px;
      border-radius:999px;
      background:#d9904d;
      color:white;
      font-weight:800;
      font-size:.88rem;
      border:0;
      cursor:pointer;
    }
    .guide-url {
      display:block;
      margin-top:10px;
      padding:10px 12px;
      background:rgba(255,255,255,.65);
      border:1px dashed #d9904d;
      border-radius:12px;
      color:#6f421f;
      font-size:.82rem;
      line-height:1.45;
      word-break:break-all;
    }

    .meal-grid {
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
    }
    .meal-row {
      display:grid;
      grid-template-columns:74px 1fr;
      gap:10px;
      align-items:start;
      padding:10px 0;
      border-bottom:1px dashed var(--line);
    }
    .meal-row:last-child { border-bottom:0; }
    .meal-label { color:var(--green); font-weight:900; font-size:.9rem; }
    .meal-place { font-weight:800; color:var(--navy); }
    .meal-note { color:var(--muted); font-size:.88rem; margin-top:2px; }

    .route-list { display:grid; gap:12px; }
    .route-card {
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:16px;
    }
    .route-title {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:8px;
    }
    .route-title h3 { color:var(--navy); font-size:1.05rem; line-height:1.35; }
    .route-title i { color:var(--blue); }
    .route-card p { color:#4b5565; font-size:.94rem; }
    

    .highlight-section { margin-top:18px; }

    .highlight-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    .spot-card {
      background:white;
      border:1px solid var(--line);
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 8px 18px rgba(23,35,61,.08);
    }
    .spot-card img { height:96px; object-fit:cover; }
    .spot-card img.broken { display:none; }
    .spot-body { padding:10px; }
    .spot-body h4 { color:var(--navy); font-size:.92rem; line-height:1.3; margin-bottom:4px; }
    .spot-body p { color:var(--muted); font-size:.78rem; line-height:1.55; }

    .hotel-card {
      background:linear-gradient(135deg, #17233d, #2d3f67);
      color:white;
      border:none;
      margin-top:20px;
    }
    .hotel-card h3 { font-size:1.05rem; margin-bottom:8px; color:#ffe29a; }
    .hotel-card p { color:rgba(255,255,255,.88); font-size:.9rem; }
    .hotel-actions { display:grid; grid-template-columns:1fr; gap:9px; margin-top:13px; }
    .hotel-btn {
      display:flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      border:1px solid rgba(255,255,255,.25);
      background:rgba(255,255,255,.12);
      border-radius:14px;
      padding:11px;
      color:white;
      font-weight:800;
      font-size:.88rem;
    }

    details.info-card summary {
      cursor:pointer;
      font-weight:900;
      color:var(--navy);
      list-style:none;
    }
    details.info-card summary::-webkit-details-marker { display:none; }
    details.info-card summary:after { content:'＋'; float:right; color:var(--rose); }
    details.info-card[open] summary:after { content:'－'; }
    details.info-card div { margin-top:12px; color:#4b5565; font-size:.92rem; }

    .option-switcher {
      display:flex;
      overflow-x:auto;
      gap:8px;
      margin:0 0 14px;
      padding-bottom:2px;
    }
    .option-switcher::-webkit-scrollbar { display:none; }
    .option-btn {
      flex:0 0 auto;
      border:1px solid var(--line);
      background:white;
      border-radius:999px;
      padding:8px 12px;
      color:var(--navy);
      font-weight:800;
      font-size:.82rem;
      cursor:pointer;
    }
    .option-btn.active { background:var(--rose); color:white; border-color:var(--rose); }
    .route-group { display:none; }
    .route-group.active { display:block; }

    .simple-page {
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:16px;
      margin-bottom:14px;
    }
    .simple-table-wrap {
      overflow-x:auto;
      border:1px solid var(--line);
      border-radius:16px;
      background:#fff;
      box-shadow:0 6px 16px rgba(23,35,61,.06);
      margin-bottom:16px;
    }

    .customs-list {
      display:grid;
      gap:12px;
    }
    .customs-card {
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px;
      background:#fff;
    }
    .customs-q {
      color:var(--navy);
      font-weight:900;
      font-size:.96rem;
      line-height:1.45;
      margin-bottom:10px;
    }
    .customs-en {
      background:var(--sky);
      border-radius:12px;
      padding:11px 12px;
      color:#24476f;
      font-size:.92rem;
      line-height:1.65;
      margin-bottom:10px;
    }
    .customs-zh {
      color:var(--muted);
      font-size:.84rem;
      line-height:1.55;
    }
    .simple-table {
      width:100%;
      border-collapse:collapse;
      min-width:620px;
      font-size:.88rem;
      line-height:1.55;
    }
    .simple-table th {
      background:var(--navy);
      color:#fff;
      text-align:left;
      padding:11px 12px;
      font-weight:900;
      white-space:nowrap;
    }
    .simple-table td {
      padding:11px 12px;
      border-bottom:1px solid var(--line);
      vertical-align:top;
    }
    .simple-table tr:last-child td { border-bottom:0; }
    .simple-table td:first-child { font-weight:800; color:var(--navy); white-space:nowrap; }
    .simple-table th:last-child {
      min-width:220px;
      width:30%;
    }
    .simple-table td:last-child {
      min-width:240px;
      width:32%;
      line-height:1.6;
      word-break:keep-all;
    }
    .simple-note {
      background:var(--cream);
      border-left:5px solid #d9904d;
      border-radius:14px;
      padding:13px;
      color:#6f421f;
      font-size:.9rem;
      margin-top:4px;
    }

    
    @media (min-width:640px){
      .hero-img { height:300px; }
      .meal-grid { grid-template-columns:1fr 1fr 1fr; }
      .meal-row { display:block; border-bottom:0; border-right:1px dashed var(--line); padding:0 12px; }
      .meal-row:last-child { border-right:0; }
      .highlight-grid { grid-template-columns:repeat(3,1fr); }
      .spot-card img { height:125px; }
      .hotel-actions { grid-template-columns:1fr 1fr; }
    }
  </style>
</head>

    function el(tag, className, html){
      const node = document.createElement(tag);
      if(className) node.className = className;
      if(html) node.innerHTML = html;
      return node;
    }

    function renderNav(){
      const nav = document.getElementById('dayNav');
      nav.innerHTML = '';
      days.forEach(function(day, index){
        const a = el('a', 'day-tab' + (index === 0 ? ' active' : ''), day.tab);
        a.href = '#';
        a.onclick = function(event){ switchDay(event, day.id); };
        nav.appendChild(a);
      });
    }

    function renderRoutes(container, day){
      const section = el('section');
      section.appendChild(el('h3', 'section-title', '<i class="fa-solid fa-route"></i> 行程安排'));
      const list = el('div', 'route-list');
      const routes = day.options ? day.options[0].routes : day.routes;
      routes.forEach(function(r){
        list.appendChild(el('article', 'route-card', '<div class="route-title"><h3>' + r[0] + '</h3></div><p>' + r[1] + '</p>'));
      });
      section.appendChild(list);
      container.appendChild(section);
    }

    function renderOptions(container, day){
      if(!day.options){ renderRoutes(container, day); return; }
      const section = el('section');
      section.appendChild(el('h3', 'section-title', '<i class="fa-solid fa-route"></i> 行程安排'));
      const switcher = el('div', 'option-switcher');
      const groups = [];
      day.options.forEach(function(option, index){
        const btn = el('button', 'option-btn' + (index === 0 ? ' active' : ''), option.name);
        btn.onclick = function(){
          switcher.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
          groups.forEach(g => g.classList.remove('active'));
          btn.classList.add('active');
          groups[index].classList.add('active');
        };
        switcher.appendChild(btn);
      });
      section.appendChild(switcher);
      day.options.forEach(function(option, index){
        const group = el('div', 'route-group' + (index === 0 ? ' active' : ''));
        const list = el('div', 'route-list');
        option.routes.forEach(function(r){
          list.appendChild(el('article', 'route-card', '<div class="route-title"><h3>' + r[0] + '</h3></div><p>' + r[1] + '</p>'));
        });
        group.appendChild(list);
        if(option.highlights && option.highlights.length){ renderHighlights(group, option.highlights); }
        if(option.meals && option.meals.length){ renderMeals(group, option.meals); }
        groups.push(group);
        section.appendChild(group);
      });
      container.appendChild(section);
    }

    function renderHighlights(container, spots){
      if(!spots || spots.length === 0) return;
      const section = el('section', 'highlight-section');
      section.appendChild(el('h3', 'section-title', '<i class="fa-solid fa-camera-retro"></i> 今日風景'));
      const grid = el('div', 'highlight-grid');
      spots.forEach(function(s){
        grid.appendChild(el('article', 'spot-card', '<img loading="lazy" src="' + s[2] + '" alt="' + s[0] + '" onerror="this.classList.add(\'broken\')"><div class="spot-body"><h4>' + s[0] + '</h4><p>' + s[1] + '</p></div>'));
      });
      section.appendChild(grid);
      container.appendChild(section);
    }

    function renderTips(container, day){
      if(!day.tips && !day.guideLink) return;
      let html = day.tips || '';
      if(day.guideLink){
        html += '<br><a class="guide-link" href="' + day.guideLink + '" target="_top" rel="noopener"><i class="fa-solid fa-file-lines"></i> 機場搭地鐵到市區圖文教學</a>';
        html += '<span class="guide-url">若按鈕無法開啟，請複製此連結：<br>' + day.guideLink + '</span>';
      }
      container.appendChild(el('section', '', '<div class="tips-card">' + html + '</div>'));
    }

    function renderMeals(container, meals){
      const section = el('section');
      section.appendChild(el('h3', 'section-title', '<i class="fa-solid fa-utensils"></i> 餐食安排'));
      const card = el('div', 'meal-card');
      const grid = el('div', 'meal-grid');
      meals.forEach(function(m){
        grid.appendChild(el('div', 'meal-row', '<div class="meal-label">' + m[0] + '</div><div><div class="meal-place">' + m[1] + '</div><div class="meal-note">' + m[2] + '</div></div>'));
      });
      card.appendChild(grid);
      section.appendChild(card);
      container.appendChild(section);
    }

    function renderHotel(container, hotel){
      container.appendChild(el('section', '', '<div class="hotel-card"><h3><i class="fa-solid fa-hotel"></i> 今日住宿</h3><p><strong>' + hotel.name + '</strong><br>' + hotel.desc + '</p></div>'));
    }

    function renderSimpleTable(headers, rows){
      let html = '<div class="simple-table-wrap"><table class="simple-table"><thead><tr>';
      headers.forEach(function(h){ html += '<th>' + h + '</th>'; });
      html += '</tr></thead><tbody>';
      rows.forEach(function(row){
        html += '<tr>';
        row.forEach(function(cell){ html += '<td>' + cell + '</td>'; });
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      return html;
    }

    function renderInfoPage(day, index){
      const wrapper = el('div', 'day-content' + (index === 0 ? ' active' : ''));
      wrapper.id = day.id;
      wrapper.appendChild(el('section', 'hero', '<div class="hero-body"><div class="eyebrow">' + day.date + '</div><h2>' + day.title + '</h2><p class="intro">' + day.intro + '</p></div>'));

      if(day.id === 'transport'){
        const transportRows = [
          ['阿姨抵達倫敦','6/3','SQ308 → London Heathrow T2','15:45 抵達'],
          ['媽媽抵達倫敦','6/3','CI0081 → London Heathrow T3','16:30 抵達'],
          ['我：維也納→倫敦','6/3','OS331 VIE → LDN','06:50–08:20'],
          ['倫敦→劍橋火車','6/6','King’s Cross → Cambridge','09:24–10:14 / 16:12–17:02'],
          ['倫敦→愛丁堡火車','6/8','King’s Cross → Edinburgh Waverley','09:30–13:38'],
          ['高地三日團','6/10–6/12','Rabbie’s Isle of Skye 3-day tour','6/10 08:15 集合；6/12 約 19:30 回愛丁堡'],
          ['愛丁堡→維也納','6/13','OS346 EDI → VIE','10:45–14:20'],
          ['台北↔維也納','5/26、6/17','TPE–VIE / VIE–TPE','22:40–08:40 / 16:00–13:25']
        ];
        const hotelRows = [
          ['倫敦','6/3–6/8','Templeton Place Aparthotel','17 Templeton Place, London SW5 9NB'],
          ['愛丁堡','6/8–6/10','Roomzzz Edinburgh','Saint James Quarter, Leith St, Edinburgh EH1 3AD, United Kingdom'],
          ['天空島/高地','6/10–6/12','Sgurr Alasdair B&B En-Suite','Viewfield Road IV51 9ES'],
          ['愛丁堡機場','6/12–6/13','Hampton by Hilton Edinburgh Airport','5 Almond Ave, Ingliston, Edinburgh, Newbridge EH12 9GN, United Kingdom']
        ];
        wrapper.appendChild(el('section', 'simple-page', '<h3 class="section-title"><i class="fa-solid fa-plane"></i> 主要航班與交通</h3>' + renderSimpleTable(['類別','日期','路線 / 項目','時間'], transportRows) + '<h3 class="section-title"><i class="fa-solid fa-hotel"></i> 住宿資訊</h3>' + renderSimpleTable(['城市','日期','住宿','地址 / 區域'], hotelRows)));
        return wrapper;
      }

      if(day.id === 'customs'){
        const customsRows = [
          ['What is the purpose of your visit?','We are visiting the UK for tourism.','旅遊觀光'],
          ['How long will you stay in the UK?','We will stay in the UK from 3 June to 13 June.','6/3–6/13 在英國'],
          ['Where will you stay?','We will stay at Templeton Place Aparthotel in London, then Roomzzz Edinburgh and a hotel near Edinburgh Airport.','可出示飯店訂房資料'],
          ['What will you do in the UK?','We will visit London, Cambridge, Edinburgh, and join a three-day Highlands tour.','倫敦、劍橋、愛丁堡、高地團'],
          ['Who are you travelling with?','I am travelling with my mother and aunt.','與媽媽和阿姨同行'],
          ['Do you have a return or onward ticket?','Yes. We will fly from Edinburgh to Vienna on 13 June, and later return to Taiwan.','可出示 EDI → VIE 航班與回台機票'],
          ['Do you have travel insurance?','Yes, we have travel insurance.','建議存在手機並可離線查看']
        ];

        let customsHtml = '<div class="customs-list">';
        customsRows.forEach(function(row){
          customsHtml += '<div class="customs-card">';
          customsHtml += '<div class="customs-q">' + row[0] + '</div>';
          customsHtml += '<div class="customs-en">' + row[1] + '</div>';
          customsHtml += '<div class="customs-zh">💡 ' + row[2] + '</div>';
          customsHtml += '</div>';
        });
        customsHtml += '</div>';

        wrapper.appendChild(el('section', 'simple-page', '<h3 class="section-title"><i class="fa-solid fa-passport"></i> 海關常見問答</h3>' + customsHtml + '<div class="simple-note"><strong>小提醒：</strong><br>海關通常不會問太多問題，保持自然回答即可。若聽不清楚，可以禮貌請對方再說一次：<br><br>“Sorry, could you say that again?”</div>'));
        return wrapper;
      }

      return wrapper;
    }

    function renderDay(day, index){
      if(day.id === 'transport' || day.id === 'customs') return renderInfoPage(day, index);
      const wrapper = el('div', 'day-content' + (index === 0 ? ' active' : ''));
      wrapper.id = day.id;
      wrapper.appendChild(el('section', 'hero', '<img class="hero-img" loading="lazy" src="' + day.hero + '" alt="' + day.title + '" onerror="this.classList.add(\'broken\')"><div class="hero-body"><div class="eyebrow">' + day.date + '</div><h2>' + day.title + '</h2><p class="intro">' + day.intro + '</p></div>'));
      renderOptions(wrapper, day);
      if(day.highlights && day.highlights.length){ renderHighlights(wrapper, day.highlights); }
      renderTips(wrapper, day);
      if(day.meals && day.meals.length){ renderMeals(wrapper, day.meals); }
      renderHotel(wrapper, day.hotel);
      return wrapper;
    }

    function renderApp(){
      renderNav();
      const app = document.getElementById('app');
      app.innerHTML = '';
      days.forEach(function(day, index){ app.appendChild(renderDay(day, index)); });
    }

    function switchDay(event, dayId){
      event.preventDefault();
      document.querySelectorAll('.day-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.day-tab').forEach(el => el.classList.remove('active'));
      document.getElementById(dayId).classList.add('active');
      event.currentTarget.classList.add('active');
      window.scrollTo({top:0, behavior:'smooth'});
    }

    renderApp();
  </script>
</body>
</html>
